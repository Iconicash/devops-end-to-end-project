<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevOps Todo App</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; background:#f4f5f7; }
  h1 { color: #222; }
  input { padding: 8px; width: 70%; }
  button { padding: 8px 14px; }
  ul { list-style: none; padding: 0; }
  li { background: #fff; margin: 6px 0; padding: 10px; border-radius: 6px; display:flex; justify-content:space-between; }
  .done { text-decoration: line-through; color: #888; }
</style>
</head>
<body>
  <h1>📝 Todo List</h1>
  <input id="title" placeholder="New todo..." />
  <button onclick="addTodo()">Add</button>
  <ul id="list"></ul>

<script>
async function loadTodos() {
  const res = await fetch('/api/todos');
  const todos = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  todos.forEach(t => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="${t.completed ? 'done' : ''}">${t.title}</span>
      <span>
        <button onclick="toggle('${t._id}', ${!t.completed})">✓</button>
        <button onclick="remove('${t._id}')">✕</button>
      </span>`;
    list.appendChild(li);
  });
}
async function addTodo() {
  const title = document.getElementById('title').value;
  if (!title) return;
  await fetch('/api/todos', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title}) });
  document.getElementById('title').value = '';
  loadTodos();
}
async function toggle(id, completed) {
  await fetch('/api/todos/' + id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({completed}) });
  loadTodos();
}
async function remove(id) {
  await fetch('/api/todos/' + id, { method: 'DELETE' });
  loadTodos();
}
loadTodos();
</script>
</body>
</html>
